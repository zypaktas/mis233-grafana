# MIS 233 final project – Zeynep Sudem
# One command starts Grafana with all three plugins and the mock Campus Sensor API:
#   docker compose up -d --build      →  http://localhost:3000
services:
  grafana:
    image: grafana/grafana-enterprise:${GRAFANA_VERSION:-13.2.4}
    container_name: mis233-grafana
    ports:
      - '3000:3000'
    volumes:
      - ./zeynepsudem-insight-panel/dist:/var/lib/grafana/plugins/zeynepsudem-insight-panel
      - ./zeynepsudem-campus-datasource/dist:/var/lib/grafana/plugins/zeynepsudem-campus-datasource
      - ./zeynepsudem-heatmap-panel/dist:/var/lib/grafana/plugins/zeynepsudem-heatmap-panel
      - ./provisioning:/etc/grafana/provisioning
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: zeynepsudem-insight-panel,zeynepsudem-campus-datasource,zeynepsudem-heatmap-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/campus-overview.json
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    depends_on:
      - campus-api

  campus-api:
    build: ./mock-api
    container_name: mis233-campus-api
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      API_KEY: mis233-demo-key
